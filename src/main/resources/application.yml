server:
  port: 8080
spring:
  application:
    name: portfilio
  datasource:
    url: jdbc:postgresql://localhost:5433/springdb
    username: admin
    password: admin123

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

    show-sql: off

